server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /branding/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
